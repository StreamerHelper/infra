name: Build and Push Docker Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'New immutable image tag (e.g., v1.0.0)'
        required: true
      backend_ref:
        description: 'Exact web-server tag or commit to build'
        required: true
      frontend_ref:
        description: 'Exact web tag or commit to build'
        required: true

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_ORG: streamerhelper
  IMAGE_PREFIX: streamerhelper

concurrency:
  group: docker-release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout infra repository
        uses: actions/checkout@v4
        with:
          path: infra

      - name: Determine immutable release inputs
        id: release
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
          REQUESTED_BACKEND_REF: ${{ github.event.inputs.backend_ref }}
          REQUESTED_FRONTEND_REF: ${{ github.event.inputs.frontend_ref }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$REQUESTED_VERSION"
            BACKEND_REF="$REQUESTED_BACKEND_REF"
            FRONTEND_REF="$REQUESTED_FRONTEND_REF"
          else
            VERSION="$GITHUB_REF_NAME"
            BACKEND_REF="$GITHUB_REF_NAME"
            FRONTEND_REF="$GITHUB_REF_NAME"
          fi

          if [ -z "$VERSION" ] || [ "$VERSION" = "latest" ] \
            || [[ ! "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::A new explicit image version is required; 'latest' is not publishable."
            exit 1
          fi
          for ref in "$BACKEND_REF" "$FRONTEND_REF"; do
            if [ -z "$ref" ] || [[ ! "$ref" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,255}$ ]]; then
              echo "::error::Backend and frontend refs must be explicit tags or commits."
              exit 1
            fi
          done

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "backend_ref=$BACKEND_REF" >> "$GITHUB_OUTPUT"
          echo "frontend_ref=$FRONTEND_REF" >> "$GITHUB_OUTPUT"
          echo "Building immutable release $VERSION"

      - name: Checkout backend repository
        uses: actions/checkout@v4
        with:
          repository: StreamerHelper/web-server
          path: web-server
          ref: ${{ steps.release.outputs.backend_ref }}
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Checkout frontend repository
        uses: actions/checkout@v4
        with:
          repository: StreamerHelper/web
          path: web
          ref: ${{ steps.release.outputs.frontend_ref }}
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Capture source revisions
        id: sources
        run: |
          echo "infra_sha=$(git -C infra rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "backend_sha=$(git -C web-server rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "frontend_sha=$(git -C web rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Test release control invariants
        run: |
          bash -n infra/bin/control infra/bin/assert-registry-auth infra/bin/assert-image-tag-unused infra/bin/upgrade-config infra/build-and-push.sh infra/test/*.sh
          bash infra/test/control-release-pin.test.sh
          bash infra/test/compose-release-version.test.sh
          bash infra/test/immutable-tag-probe.test.sh
          bash infra/test/publish-preflight.test.sh
          bash infra/test/config-upgrade.test.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse an existing release tag
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for component in backend frontend browser douyin-resolver; do
            image="${DOCKER_REGISTRY}/${DOCKER_ORG}/${IMAGE_PREFIX}-${component}:${VERSION}"
            if ! bash infra/bin/assert-image-tag-unused "$image"; then
              echo "::error::Immutable tag check failed for $image"
              exit 1
            fi
          done

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./web-server
          file: ./infra/Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_ORG }}/${{ env.IMAGE_PREFIX }}-backend:${{ steps.release.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./infra/Dockerfile.frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_ORG }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.release.outputs.version }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and push browser
        uses: docker/build-push-action@v5
        with:
          context: ./infra
          file: ./infra/Dockerfile.browser
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_ORG }}/${{ env.IMAGE_PREFIX }}-browser:${{ steps.release.outputs.version }}
          cache-from: type=gha,scope=browser
          cache-to: type=gha,mode=max,scope=browser

      - name: Build and push Douyin resolver
        uses: docker/build-push-action@v5
        with:
          context: ./infra/douyin-resolver
          file: ./infra/douyin-resolver/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_ORG }}/${{ env.IMAGE_PREFIX }}-douyin-resolver:${{ steps.release.outputs.version }}
          cache-from: type=gha,scope=douyin-resolver
          cache-to: type=gha,mode=max,scope=douyin-resolver

      - name: Summary
        run: |
          echo "### Images Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ env.IMAGE_PREFIX }}-backend | \`${{ steps.release.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ env.IMAGE_PREFIX }}-frontend | \`${{ steps.release.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ env.IMAGE_PREFIX }}-browser | \`${{ steps.release.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ env.IMAGE_PREFIX }}-douyin-resolver | \`${{ steps.release.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Sources: infra \`${{ steps.sources.outputs.infra_sha }}\`, backend \`${{ steps.sources.outputs.backend_sha }}\`, frontend \`${{ steps.sources.outputs.frontend_sha }}\`." >> $GITHUB_STEP_SUMMARY
