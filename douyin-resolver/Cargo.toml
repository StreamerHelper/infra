[package]
name = "douyin-resolver"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Anonymous Douyin live-room resolver for StreamerHelper"
publish = false

[dependencies]
axum = "=0.8.9"
biliup = { git = "https://github.com/biliup/biliup.git", rev = "adf6a1c03be9f777a76c8c501038c27f3d90a097" }
bytes = "=1.12.1"
reqwest = { version = "=0.13.4", features = ["cookies", "form", "query"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
