# 应用服务: Browser, Douyin Resolver, Backend, Frontend, Nginx
# 使用: ./bin/control app up
# 前置条件: infra 服务必须已启动

services:
  # Shared browser automation runtime for web login flows.
  browser:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_ORG:-streamerhelper}/${IMAGE_PREFIX:-streamerhelper}-browser:${BROWSER_VERSION:?BROWSER_VERSION is required}
    container_name: streamer-browser
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    stop_grace_period: 30s
    command:
      - --user-data-dir=/data/profile
    volumes:
      - douyin_browser_profile:/data/profile
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec "exec 3<>/dev/tcp/127.0.0.1/9222;
          printf 'GET /json/version HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          timeout 3 grep -q webSocketDebuggerUrl <&3"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    networks:
      - browser-network

  # Anonymous Douyin live-room resolver, isolated from host networking.
  douyin-resolver:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_ORG:-streamerhelper}/${IMAGE_PREFIX:-streamerhelper}-douyin-resolver:${DOUYIN_RESOLVER_VERSION:?DOUYIN_RESOLVER_VERSION is required}
    container_name: streamer-douyin-resolver
    restart: unless-stopped
    environment:
      DOUYIN_RESOLVER_BIND: 0.0.0.0:7100
    expose:
      - "7100"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/douyin-resolver", "healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    networks:
      - douyin-resolver-network

  # Backend Application
  backend:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_ORG:-streamerhelper}/${IMAGE_PREFIX:-streamerhelper}-backend:${BACKEND_VERSION:?BACKEND_VERSION is required}
    container_name: streamer-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS:---dns-result-order=ipv4first}
      TZ: ${TZ:-Asia/Shanghai}
      MIDWAY_LOGGER_WRITEABLE_DIR: /app
      LOG_DIR: /app/logs
      # App
      APP_PORT: ${APP_PORT:-7001}
      APP_KEYS: ${APP_KEYS:-streamer-helper-secret-key}
      # Database
      TYPEORM_HOST: ${TYPEORM_HOST:-postgres}
      TYPEORM_PORT: ${TYPEORM_PORT:-5432}
      TYPEORM_USERNAME: ${TYPEORM_USERNAME:-postgres}
      TYPEORM_PASSWORD: ${TYPEORM_PASSWORD:-postgres}
      TYPEORM_DATABASE: ${TYPEORM_DATABASE:-streamerhelper}
      # Redis
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # S3/MinIO
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:7090}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:7090}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-streamerhelper-archive}
      # Browser automation
      DOUYIN_BROWSER_ENDPOINT: ${DOUYIN_BROWSER_ENDPOINT:-http://browser:9222}
      # Anonymous Douyin live-room resolver
      DOUYIN_RESOLVER_URL: ${DOUYIN_RESOLVER_URL:-http://douyin-resolver:7100}
    volumes:
      - ${CONFIG_DIR:-~/.streamer-helper}/settings.json:/app/config/settings.json
      - ${CONFIG_DIR:-~/.streamer-helper}/Logs/backend:/app/logs
      - backend_temp:/app/temp
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "${APP_PORT:-7001}"]
      interval: 10s
      timeout: 10s
      start_period: 60s
      retries: 5
    networks:
      - streamer-network
      - browser-network
      - douyin-resolver-network

  # Frontend Application
  frontend:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${DOCKER_ORG:-streamerhelper}/${IMAGE_PREFIX:-streamerhelper}-frontend:${FRONTEND_VERSION:?FRONTEND_VERSION is required}
    container_name: streamer-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider \"http://$$(hostname):3000/\""]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - streamer-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.30.4-alpine3.24@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    container_name: streamer-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-7080}:80"
      - "${HTTPS_PORT:-7443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${CONFIG_DIR:-~/.streamer-helper}/Logs/nginx:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    depends_on:
      - frontend
      - backend
    networks:
      - streamer-network

networks:
  streamer-network:
    external: true
  browser-network:
    driver: bridge
  douyin-resolver-network:
    driver: bridge

volumes:
  backend_temp:
  douyin_browser_profile:
